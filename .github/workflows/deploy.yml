name: Deploy ONAX
on:
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Ghep va giai nen
        run: |
          cat onax-*.bin > site.zip
          unzip -q site.zip -d out
      - name: Ghi de file sua o thu muc goc
        run: |
          for f in *.js *.html *.css; do
            if [ -f "$f" ]; then cp "$f" out/botmodff-main/; fi
          done
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: out/botmodff-main
      - id: deployment
        uses: actions/deploy-pages@v4
        
